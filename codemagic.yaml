workflows:
  android-debug:
    name: Build Android APK
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Make Gradle Wrapper executable
        script: chmod +x ./gradlew

      - name: Build debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
