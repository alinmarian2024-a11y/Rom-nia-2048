workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-9.3.1/bin:$PATH"
          gradle --version
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
